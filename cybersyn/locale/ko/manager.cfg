[cybersyn-diag]
reason-no-provider=No provider
chip-no-provider=No provider
why-no-provider=No station on network __3__ provides this item.
fix-no-provider=Build a provider, or check that its combinator is powered and its network mask includes __3__.
reason-r-at-limit=Requester at its train limit
chip-r-at-limit=Requester full
why-r-at-limit=Train limit reached: __1__ of __2__ trains are inbound or unloading, so the dispatcher skips this stop.
fix-r-at-limit=Raise the train limit, or check the unloader.
reason-r-disabled=Requester disabled
chip-r-disabled=Disabled
why-r-disabled=The stop's train limit is 0.
fix-r-disabled=Raise the train limit.
reason-r-is-providing=Requester is providing the item
chip-r-is-providing=Providing
why-r-is-providing=This stop is sending __1__ of the item out, so it cannot request it until that train has left.
fix-r-is-providing=Split the stop, or give the item its own threshold.
reason-p-at-limit=Provider at its train limit
chip-p-at-limit=Provider full
why-p-at-limit=The best provider has reached its train limit: __1__ of __2__ trains.
fix-p-at-limit=Raise the provider's train limit, or check its loader.
reason-p-is-requesting=Provider is requesting the item
chip-p-is-requesting=Provider requesting
why-p-is-requesting=The best provider has __1__ of the item inbound, so it cannot provide it now.
fix-p-is-requesting=Split the stop, or give the item its own threshold.
reason-mask-mismatch=Network mask mismatch
chip-mask-mismatch=Network mask
why-mask-mismatch=Requester mask __1__ and provider mask __2__ share no bit.
fix-mask-mismatch=Set the network signals so the two masks share a bit.
reason-no-surface-route=No surface route
chip-no-surface-route=No route
why-no-surface-route=No surface connection joins the provider's surface (__1__) and the requester's (__2__).
fix-no-surface-route=Connect the surfaces, or put the stops on separate networks.
reason-p-below-threshold=Provider below threshold
chip-p-below-threshold=Provider low
why-p-below-threshold=The best provider has __1__ of __2__ needed.
fix-p-below-threshold=Supply the provider, or lower the request threshold.
reason-no-trains-on-network=No train available
chip-no-trains-on-network=No train
why-no-trains-on-network=No train is available on network __3__ (__2__ in its fleet).
fix-no-trains-on-network=Add trains to depots on network __3__, or find out why its trains do not come back.
reason-train-filtered=Trains filtered
chip-train-filtered=Trains filtered
why-train-filtered=__1__ trains available, none usable: __4__ network mask, __5__ manual mode or broken schedule, __6__ surface.
fix-train-filtered=Check the trains' network masks, put them back in automatic mode, or repair their schedules.
reason-capacity=Train too small
chip-capacity=Train too small
why-capacity=The largest available train carries __2__ slots; the request threshold needs __1__.
fix-capacity=Lower the request threshold, or add a larger train on this network.
reason-r-layout=No train fits the requester
chip-r-layout=Layout (R)
why-r-layout=No available train matches the requester's accepted layouts.
fix-r-layout=Add a train with an accepted layout, or relax the requester's allow list.
reason-p-layout=No train fits the provider
chip-p-layout=Layout (P)
why-p-layout=No available train matches the provider's accepted layouts.
fix-p-layout=Add a train with an accepted layout, or relax the provider's allow list.
reason-all-in-interrupt=Trains in interrupts
chip-all-in-interrupt=Trains in interrupts
why-all-in-interrupt=Every train that could serve this request is executing an interrupt.
fix-all-in-interrupt=Wait for the interrupts to finish, or narrow their conditions.
lost-priority=Lost to __1__ ×__2__
kind-unserved-reason=Unserved
kind-served=Served
kind-flapping=Flapping
kind-dispatch-failed=Dispatch failed
kind-delivery-failed=Delivery failed
